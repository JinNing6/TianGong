name: Publish TianGong to PyPI

on:
  release:
    types: [published]
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v* tag to publish, for example v0.1.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: tiangong-pypi-publish-${{ github.event.release.tag_name || github.ref_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build, verify, and publish package
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Resolve release tag
        id: release
        shell: bash
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            tag="${{ github.event.release.tag_name }}"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="${{ inputs.tag }}"
          fi

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z]+)*$ ]]; then
            echo "Release tag must look like v0.1.0, got: $tag" >&2
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Verify release tag and package version
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          git fetch --force origin main:refs/remotes/origin/main --tags

          tag_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
          head_commit="$(git rev-parse HEAD)"
          if [[ "$tag_commit" != "$head_commit" ]]; then
            echo "Checked-out commit $head_commit does not match $RELEASE_TAG commit $tag_commit" >&2
            exit 1
          fi

          if ! git merge-base --is-ancestor "$head_commit" origin/main; then
            echo "$RELEASE_TAG must point to a commit already reachable from origin/main" >&2
            exit 1
          fi

          python - <<'PY'
          import os
          import pathlib
          import re
          import sys

          release_tag = os.environ["RELEASE_TAG"]
          expected_version = release_tag.removeprefix("v")
          pyproject = pathlib.Path("pyproject.toml").read_text(encoding="utf-8")
          match = re.search(r'(?m)^version\s*=\s*"([^"]+)"', pyproject)
          project_version = match.group(1) if match else ""
          if project_version != expected_version:
              print(
                  f"pyproject.toml version {project_version or '<missing>'} does not match release tag {release_tag}",
                  file=sys.stderr,
              )
              raise SystemExit(1)
          PY

      - name: Install package with dev gates
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Test
        run: python -m pytest -q

      - name: Check public launch assets
        run: tiangong-mcp public-launch-assets

      - name: Build package
        run: python -m build

      - name: Check package metadata
        run: python -m twine check dist/*

      - name: Check public release boundary
        run: tiangong-mcp public-release-boundary

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
