name: Publish TianGong to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: tiangong-pypi-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build, verify, and publish package
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package with dev gates
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Test
        run: python -m pytest -q

      - name: Check public launch assets
        run: tiangong-mcp public-launch-assets

      - name: Build package
        run: python -m build

      - name: Check package metadata
        run: python -m twine check dist/*

      - name: Check public release boundary
        run: tiangong-mcp public-release-boundary

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
